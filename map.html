<main>
    <h2>Illinois Institute of Technology</h2>

    <div id="map"></div>

    <button id="questionBtn">Questions?</button>
</main>

<script>
function initMap() {

    const iit = {
        lat: 41.8349,
        lng: -87.6270
    };

    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 15,
            center: iit
        }
    );

    const marker = new google.maps.Marker({
        position: iit,
        map: map,
        title: "Illinois Institute of Technology"
    });

    const infoWindow = new google.maps.InfoWindow({
        content: "<h3>Illinois Institute of Technology</h3><p>Chicago Campus</p>"
    });

    marker.addListener("click", () => {
        infoWindow.open(map, marker);
    });

    map.setMapTypeId("satellite");
}
</script>

<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1F-BpX660SBK3-Vw9O9f7AEvTAIH8rI&callback=initMap"
async
defer>
</script>
